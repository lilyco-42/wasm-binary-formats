name: Build engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    env:
      CAPSTONE_REF: 5.0.5
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The same code, two targets: host tests exercise the logic, the wasm build is
      # what the browser actually loads. The wasm goes first because one host test reads it:
      # the WebAssembly section walk runs over the module LLVM just produced, which is bytes no
      # fixture of ours authored. Locally, where the file may not exist, that test skips.
      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown

      # The optional analysis module is a separate crate and a separate artifact: nothing in the
      # structural readers depends on it, and the page only downloads it when a visitor asks.
      - name: Build analysis module
        working-directory: analysis
        run: cargo build --release --target wasm32-unknown-unknown

      # The disassembler is a C engine on a C toolchain, and it belongs here rather than in a side
      # workflow: an artefact nobody publishes is an experiment, not a feature. Capstone is BSD-3,
      # emscripten installs from apt in about twenty seconds, and only x86 / AArch64 / Thumb are
      # enabled because every architecture added is another megabyte a visitor has to opt into.
      - name: Build disassembler module
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q emscripten cmake ninja-build
          git clone --depth 1 --branch "$CAPSTONE_REF" https://github.com/capstone-engine/capstone.git vendor/capstone
          emcmake cmake -S vendor/capstone -B build-capstone -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_SHARED_LIBS=0 -DCAPSTONE_BUILD_TESTS=0 \
            -DCAPSTONE_ARCHITECTURE_DEFAULT=0 -DCAPSTONE_X86_SUPPORT=1 \
            -DCAPSTONE_ARM_SUPPORT=1 -DCAPSTONE_ARM64_SUPPORT=1
          cmake --build build-capstone -j3
          emcc -O2 -I vendor/capstone/include disasm/shim.c build-capstone/libcapstone.a \
            -o apk-lens-disasm.wasm -s STANDALONE_WASM \
            -s EXPORTED_FUNCTIONS=_disasm_run,_disasm_count,_disasm_at,_disasm_xrefs,_self_test,_malloc,_free \
            -s ERROR_ON_UNDEFINED_SYMBOLS=0
          ls -l apk-lens-disasm.wasm | awk '{print "disassembler module:", $5, "bytes"}'

      - name: Host tests
        run: cargo test

      - name: Analysis host tests
        working-directory: analysis
        run: cargo test

      # cargo needs cwd = engine/ so it picks up engine/.cargo/config.toml; the JS test
      # speaks repo-root paths, so it opts back out instead of doubling the prefix.
      - name: Wasm-level tests
        working-directory: .
        run: node test/wasm.test.mjs engine/target/wasm32-unknown-unknown/release/apk_lens.wasm

      - name: Module-level tests
        working-directory: .
        run: |
          node test/module.test.mjs \
            analysis/target/wasm32-unknown-unknown/release/apk_lens_analysis.wasm \
            engine/target/wasm32-unknown-unknown/release/apk_lens.wasm
          node test/disasm.test.mjs apk-lens-disasm.wasm

      # One artifact per module, and each with a single path: an upload that lists two files keeps
      # their directories, which is exactly what broke the site assembly the first time.
      - uses: actions/upload-artifact@v4
        with:
          name: apk-lens-wasm
          path: engine/target/wasm32-unknown-unknown/release/apk_lens.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: apk-lens-analysis-wasm
          path: analysis/target/wasm32-unknown-unknown/release/apk_lens_analysis.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: apk-lens-disasm-wasm
          path: apk-lens-disasm.wasm

  pages:
    needs: engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-lens-wasm
          path: artifact
      - uses: actions/download-artifact@v4
        with:
          name: apk-lens-analysis-wasm
          path: artifact-analysis
      - uses: actions/download-artifact@v4
        with:
          name: apk-lens-disasm-wasm
          path: artifact-disasm
      - name: Assemble site
        run: |
          mkdir -p site
          cp artifact/apk_lens.wasm site/apk-lens.wasm
          cp artifact-analysis/apk_lens_analysis.wasm site/apk-lens-analysis.wasm
          cp artifact-disasm/apk-lens-disasm.wasm site/apk-lens-disasm.wasm
          cp demo/index.html site/index.html
          ls -l site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
