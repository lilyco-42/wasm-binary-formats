name: Build engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The same code, two targets: host tests exercise the logic, the wasm build is
      # what the browser actually loads.
      - name: Host tests
        run: cargo test

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown

      # cargo needs cwd = engine/ so it picks up engine/.cargo/config.toml; the JS test
      # speaks repo-root paths, so it opts back out instead of doubling the prefix.
      - name: Wasm-level tests
        working-directory: .
        run: node test/wasm.test.mjs engine/target/wasm32-unknown-unknown/release/apk_lens.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: apk-lens-wasm
          path: engine/target/wasm32-unknown-unknown/release/apk_lens.wasm

  pages:
    needs: engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-lens-wasm
          path: artifact
      - name: Assemble site
        run: |
          mkdir -p site
          cp artifact/apk_lens.wasm site/apk-lens.wasm
          cp demo/index.html site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
